name: Request a Missing Indian Public API
description: Suggest a verified Indian public, open-data, or DPI API to index in the catalog.
title: "[API Request]: "
labels: ["catalog", "enhancement"]
body:
  - type: input
    id: api_name
    attributes:
      label: API Name
      placeholder: e.g. RBI DBIE Time Series API
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider / Ministry / Institution
    validations:
      required: true
  - type: input
    id: doc_url
    attributes:
      label: Official HTTPS Documentation URL
      placeholder: https://...
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Catalog Domain
      options:
        - DPI / India Stack
        - Open Data & Aggregators
        - BFSI
        - Fintech Middleware (B2B Aggregators)
        - Governance & Public Services
        - Judiciary & Legal
        - Healthcare
        - Mobility & Logistics
        - Aviation
        - Geo-Spatial, Weather & SpaceTech
        - Utilities & Telecom
        - E-Commerce & ONDC
        - AgriTech
        - Energy & Power
        - Education & Skilling
        - Culture, Language & Media
        - Statistics & Economy
    validations:
      required: true
  - type: dropdown
    id: access_tier
    attributes:
      label: Access Tier
      options:
        - Open Public
        - Free w/ Key
        - Sandbox/Partner Approval
        - Paid/Commercial
    validations:
      required: true
